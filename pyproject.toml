[project]
name = "mojo-semver"
version = "0.1.0"
description = "Semantic Versioning 2.0 for Mojo: parse, precedence, bump, match, identical to Python semver"
license = "Apache-2.0"
requires-python = ">=3.11,<3.15"
dependencies = ["mojo>=1.2.0,<1.3"]

[project.urls]
Homepage = "https://github.com/amarbaro/mojo-semver"
Repository = "https://github.com/amarbaro/mojo-semver"

[dependency-groups]
dev = ["semver==3.0.4"]
